<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
        background: hsl(240 10% 3.9%);
        color: hsl(0 0% 98%);
        min-height: 100vh;
        padding: 40px 20px;
        line-height: 1.5;
    }
    
    .container {
        max-width: 800px;
        margin: 0 auto;
    }
    
    h1 {
        text-align: center;
        color: hsl(0 0% 98%);
        margin-bottom: 40px;
        font-size: 2.5em;
        font-weight: 700;
        letter-spacing: -0.025em;
    }
    
    .search-box {
        background: hsl(240 10% 3.9%);
        padding: 24px;
        border-radius: 12px;
        border: 1px solid hsl(240 3.7% 15.9%);
        margin-bottom: 24px;
        box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
    }
    
    .search-input {
        display: flex;
        gap: 12px;
    }
    
    input {
        flex: 1;
        padding: 10px 14px;
        border: 1px solid hsl(240 3.7% 15.9%);
        border-radius: 8px;
        font-size: 14px;
        background: hsl(240 10% 3.9%);
        color: hsl(0 0% 98%);
        transition: all 0.2s;
        outline: none;
    }
    
    input:focus {
        border-color: hsl(0 0% 98%);
        text-rendering: 2px solid hsl(0 0% 98% / 0.2);
    }
    
    input::placeholder {
        color: hsl(240 5% 64.9%);
    }
    
    button {
        padding: 10px 16px;
        background: hsl(0 0% 98%);
        color: hsl(240 10% 3.9%);
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 500;
        transition: all 0.2s;
        white-space: nowrap;
    }
    
    button:hover {
        background: hsl(0 0% 90%);
    }
    
    button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }
    
    .weather-card {
        background: hsl(240 10% 3.9%);
        padding: 32px;
        border-radius: 12px;
        border: 1px solid hsl(240 3.7% 15.9%);
        margin-bottom: 24px;
        display: none;
        box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1);
    }
    
    .weather-card.show {
        display: block;
        animation: fadeIn 0.3s ease;
    }
    
    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(-10px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    
    .weather-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
    }
    
    .city-name {
        font-size: 1.875rem;
        color: hsl(0 0% 98%);
        font-weight: 700;
        letter-spacing: -0.025em;
    }
    
    .weather-icon {
        width: 100px;
        height: 100px;
    }
    
    .temp {
        font-size: 4rem;
        font-weight: 700;
        color: hsl(0 0% 98%);
        text-align: center;
        margin: 20px 0;
        letter-spacing: -0.05em;
    }
    
    .description {
        text-align: center;
        font-size: 1.25rem;
        color: hsl(240 5% 64.9%);
        text-transform: capitalize;
        margin-bottom: 32px;
        font-weight: 500;
    }
    
    .weather-details {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
        margin-top: 24px;
    }
    
    .detail-box {
        background: hsl(240 3.7% 15.9%);
        padding: 16px;
        border-radius: 8px;
        text-align: center;
        border: 1px solid hsl(240 3.7% 15.9%);
    }
    
    .detail-label {
        color: hsl(240 5% 64.9%);
        font-size: 0.875rem;
        margin-bottom: 8px;
        font-weight: 500;
    }
    
    .detail-value {
        color: hsl(0 0% 98%);
        font-size: 1.5rem;
        font-weight: 700;
    }
    
    .favorites-section {
        background: hsl(240 10% 3.9%);
        padding: 24px;
        border-radius: 12px;
        border: 1px solid hsl(240 3.7% 15.9%);
        box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
    }
    
    .favorites-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
    }
    
    .favorites-header h2 {
        color: hsl(0 0% 98%);
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: -0.025em;
    }
    
    .add-fav-btn {
        padding: 8px 16px;
        background: hsl(0 0% 98%);
        color: hsl(240 10% 3.9%);
        font-size: 14px;
        border-radius: 8px;
    }
    
    .add-fav-btn:hover {
        background: hsl(0 0% 90%);
    }
    
    .favorites-list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 12px;
    }
    
    .fav-item {
        background: hsl(240 3.7% 15.9%);
        padding: 16px;
        border-radius: 8px;
        text-align: center;
        cursor: pointer;
        position: relative;
        transition: all 0.2s;
        border: 1px solid hsl(240 3.7% 15.9%);
    }
    
    .fav-item:hover {
        background: hsl(240 5% 26%);
        border-color: hsl(0 0% 98%);
    }
    
    .fav-city {
        font-weight: 600;
        color: hsl(0 0% 98%);
        font-size: 0.875rem;
    }
    
    .delete-fav {
        position: absolute;
        top: -6px;
        right: -6px;
        background: hsl(0 84.2% 60.2%);
        color: hsl(0 0% 98%);
        border: 2px solid hsl(240 10% 3.9%);
        width: 24px;
        height: 24px;
        border-radius: 50%;
        cursor: pointer;
        font-size: 14px;
        padding: 0;
        font-weight: 700;
        line-height: 1;
        transition: all 0.2s;
    }
    
    .delete-fav:hover {
        background: hsl(0 90% 50%);
        transform: scale(1.1);
    }
    
    .error {
        background: hsl(0 84.2% 60.2% / 0.15);
        color: hsl(0 84.2% 60.2%);
        padding: 16px;
        border-radius: 8px;
        margin-bottom: 20px;
        display: none;
        border: 1px solid hsl(0 84.2% 60.2% / 0.5);
        font-weight: 500;
        font-size: 0.875rem;
    }
    
    .error.show {
        display: block;
        animation: slideDown 0.3s ease;
    }
    
    @keyframes slideDown {
        from {
            opacity: 0;
            transform: translateY(-10px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    
    .empty-state {
        text-align: center;
        color: hsl(240 5% 64.9%);
        padding: 32px;
        font-size: 0.875rem;
    }
    
    /* Responsive */
    @media (max-width: 640px) {
        .weather-details {
            grid-template-columns: 1fr;
        }
        
        .temp {
            font-size: 3rem;
        }
        
        h1 {
            font-size: 2rem;
        }
    }
</style>
</head>
<body>
    <div class="container">
        <h1>🌤️ Weather Dashboard</h1>
        
        <div class="search-box">
            <div class="search-input">
                <input type="text" id="cityInput" placeholder="Enter city name..." onkeypress="handleEnter(event)">
                <button onclick="searchWeather()">Search</button>
            </div>
        </div>
        
        <div class="error" id="errorBox"></div>
        
        <div class="weather-card" id="weatherCard">
            <div class="weather-header">
                <div>
                    <div class="city-name" id="cityName"></div>
                </div>
                <img class="weather-icon" id="weatherIcon" alt="Weather icon">
            </div>
            
            <div class="temp" id="temp"></div>
            <div class="description" id="description"></div>
            
            <div class="weather-details">
                <div class="detail-box">
                    <div class="detail-label">Feels Like</div>
                    <div class="detail-value" id="feelsLike"></div>
                </div>
                <div class="detail-box">
                    <div class="detail-label">Humidity</div>
                    <div class="detail-value" id="humidity"></div>
                </div>
                <div class="detail-box">
                    <div class="detail-label">Wind Speed</div>
                    <div class="detail-value" id="windSpeed"></div>
                </div>
            </div>
            
            <div class="favorites-header" style="margin-top: 20px;">
                <button class="add-fav-btn" onclick="addToFavorites()">⭐ Add to Favorites</button>
            </div>
        </div>
        
        <div class="favorites-section">
            <div class="favorites-header">
                <h2>📌 Favorite Cities</h2>
            </div>
            <div class="favorites-list" id="favoritesList">
                <div class="empty-state">No favorites yet. Search for a city and add it!</div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://weather-dashb-5lzh.onrender.com';
        let currentCity = '';

        window.onload = function() {
            loadFavorites();
        };

        function handleEnter(event) {
            if (event.key === 'Enter') {
                searchWeather();
            }
        }

        function searchWeather() {
            const city = document.getElementById('cityInput').value.trim();
            
            if (!city) {
                showError('Please enter a city name!');
                return;
            }
            
            fetch(`${API_URL}/weather/${city}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('City not found');
                    }
                    return response.json();
                })
                .then(data => {
                    displayWeather(data);
                    currentCity = data.city;
                    hideError();
                })
                .catch(error => {
                    showError('City not found. Please try again!');
                    hideWeatherCard();
                });
        }

        function displayWeather(data) {
            document.getElementById('cityName').textContent = `${data.city}, ${data.country}`;
            document.getElementById('temp').textContent = `${data.temp}°C`;
            document.getElementById('description').textContent = data.description;
            document.getElementById('feelsLike').textContent = `${data.feels_like}°C`;
            document.getElementById('humidity').textContent = `${data.humidity}%`;
            document.getElementById('windSpeed').textContent = `${data.wind_speed} m/s`;
            
            const iconUrl = `https://openweathermap.org/img/wn/${data.icon}@2x.png`;
            document.getElementById('weatherIcon').src = iconUrl;
            
            document.getElementById('weatherCard').classList.add('show');
        }

        function hideWeatherCard() {
            document.getElementById('weatherCard').classList.remove('show');
        }

        function showError(message) {
            const errorBox = document.getElementById('errorBox');
            errorBox.textContent = message;
            errorBox.classList.add('show');
        }

        function hideError() {
            document.getElementById('errorBox').classList.remove('show');
        }

        function addToFavorites() {
            if (!currentCity) return;
            
            fetch(`${API_URL}/favorites`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ city: currentCity })
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    showError(data.error);
                } else {
                    loadFavorites();
                    hideError();
                }
            });
        }

        function loadFavorites() {
            fetch(`${API_URL}/favorites`)
                .then(response => response.json())
                .then(data => {
                    const list = document.getElementById('favoritesList');
                    
                    if (data.favorites.length === 0) {
                        list.innerHTML = '<div class="empty-state">No favorites yet. Search for a city and add it!</div>';
                        return;
                    }
                    
                    list.innerHTML = data.favorites.map(fav => `
                        <div class="fav-item" onclick="searchFavorite('${fav.city}')">
                            <button class="delete-fav" onclick="event.stopPropagation(); deleteFavorite(${fav.id})">×</button>
                            <div class="fav-city">${fav.city}</div>
                        </div>
                    `).join('');
                });
        }

        function searchFavorite(city) {
            document.getElementById('cityInput').value = city;
            searchWeather();
        }

        function deleteFavorite(id) {
            fetch(`${API_URL}/favorites/${id}`, {
                method: 'DELETE'
            })
            .then(() => loadFavorites());
        }
    </script>
</body>
</html>
