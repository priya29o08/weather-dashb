<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        .search-box {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 30px;
        }
        
        .search-input {
            display: flex;
            gap: 10px;
        }
        
        input {
            flex: 1;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }
        
        button {
            padding: 15px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        
        button:hover {
            background: #5568d3;
        }
        
        .weather-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 30px;
            display: none;
        }
        
        .weather-card.show {
            display: block;
        }
        
        .weather-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .city-name {
            font-size: 2em;
            color: #333;
        }
        
        .weather-icon {
            width: 100px;
            height: 100px;
        }
        
        .temp {
            font-size: 4em;
            font-weight: bold;
            color: #667eea;
            text-align: center;
            margin: 20px 0;
        }
        
        .description {
            text-align: center;
            font-size: 1.5em;
            color: #666;
            text-transform: capitalize;
            margin-bottom: 20px;
        }
        
        .weather-details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
        }
        
        .detail-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        
        .detail-label {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 5px;
        }
        
        .detail-value {
            color: #333;
            font-size: 1.3em;
            font-weight: bold;
        }
        
        .favorites-section {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        .favorites-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .favorites-header h2 {
            color: #333;
        }
        
        .add-fav-btn {
            padding: 10px 20px;
            background: #28a745;
            font-size: 14px;
        }
        
        .add-fav-btn:hover {
            background: #218838;
        }
        
        .favorites-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }
        
        .fav-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            position: relative;
            transition: transform 0.2s;
        }
        
        .fav-item:hover {
            transform: translateY(-3px);
            background: #e9ecef;
        }
        
        .fav-city {
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        
        .delete-fav {
            position: absolute;
            top: 5px;
            right: 5px;
            background: #dc3545;
            color: white;
            border: none;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 12px;
            padding: 0;
        }
        
        .delete-fav:hover {
            background: #c82333;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        
        .error.show {
            display: block;
        }
        
        .empty-state {
            text-align: center;
            color: #999;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌤️ Weather Dashboard</h1>
        
        <div class="search-box">
            <div class="search-input">
                <input type="text" id="cityInput" placeholder="Enter city name..." onkeypress="handleEnter(event)">
                <button onclick="searchWeather()">Search</button>
            </div>
        </div>
        
        <div class="error" id="errorBox"></div>
        
        <div class="weather-card" id="weatherCard">
            <div class="weather-header">
                <div>
                    <div class="city-name" id="cityName"></div>
                </div>
                <img class="weather-icon" id="weatherIcon" alt="Weather icon">
            </div>
            
            <div class="temp" id="temp"></div>
            <div class="description" id="description"></div>
            
            <div class="weather-details">
                <div class="detail-box">
                    <div class="detail-label">Feels Like</div>
                    <div class="detail-value" id="feelsLike"></div>
                </div>
                <div class="detail-box">
                    <div class="detail-label">Humidity</div>
                    <div class="detail-value" id="humidity"></div>
                </div>
                <div class="detail-box">
                    <div class="detail-label">Wind Speed</div>
                    <div class="detail-value" id="windSpeed"></div>
                </div>
            </div>
            
            <div class="favorites-header" style="margin-top: 20px;">
                <button class="add-fav-btn" onclick="addToFavorites()">⭐ Add to Favorites</button>
            </div>
        </div>
        
        <div class="favorites-section">
            <div class="favorites-header">
                <h2>📌 Favorite Cities</h2>
            </div>
            <div class="favorites-list" id="favoritesList">
                <div class="empty-state">No favorites yet. Search for a city and add it!</div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://127.0.0.1:5000';
        let currentCity = '';

        window.onload = function() {
            loadFavorites();
        };

        function handleEnter(event) {
            if (event.key === 'Enter') {
                searchWeather();
            }
        }

        function searchWeather() {
            const city = document.getElementById('cityInput').value.trim();
            
            if (!city) {
                showError('Please enter a city name!');
                return;
            }
            
            fetch(`${API_URL}/weather/${city}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('City not found');
                    }
                    return response.json();
                })
                .then(data => {
                    displayWeather(data);
                    currentCity = data.city;
                    hideError();
                })
                .catch(error => {
                    showError('City not found. Please try again!');
                    hideWeatherCard();
                });
        }

        function displayWeather(data) {
            document.getElementById('cityName').textContent = `${data.city}, ${data.country}`;
            document.getElementById('temp').textContent = `${data.temp}°C`;
            document.getElementById('description').textContent = data.description;
            document.getElementById('feelsLike').textContent = `${data.feels_like}°C`;
            document.getElementById('humidity').textContent = `${data.humidity}%`;
            document.getElementById('windSpeed').textContent = `${data.wind_speed} m/s`;
            
            const iconUrl = `https://openweathermap.org/img/wn/${data.icon}@2x.png`;
            document.getElementById('weatherIcon').src = iconUrl;
            
            document.getElementById('weatherCard').classList.add('show');
        }

        function hideWeatherCard() {
            document.getElementById('weatherCard').classList.remove('show');
        }

        function showError(message) {
            const errorBox = document.getElementById('errorBox');
            errorBox.textContent = message;
            errorBox.classList.add('show');
        }

        function hideError() {
            document.getElementById('errorBox').classList.remove('show');
        }

        function addToFavorites() {
            if (!currentCity) return;
            
            fetch(`${API_URL}/favorites`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ city: currentCity })
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    showError(data.error);
                } else {
                    loadFavorites();
                    hideError();
                }
            });
        }

        function loadFavorites() {
            fetch(`${API_URL}/favorites`)
                .then(response => response.json())
                .then(data => {
                    const list = document.getElementById('favoritesList');
                    
                    if (data.favorites.length === 0) {
                        list.innerHTML = '<div class="empty-state">No favorites yet. Search for a city and add it!</div>';
                        return;
                    }
                    
                    list.innerHTML = data.favorites.map(fav => `
                        <div class="fav-item" onclick="searchFavorite('${fav.city}')">
                            <button class="delete-fav" onclick="event.stopPropagation(); deleteFavorite(${fav.id})">×</button>
                            <div class="fav-city">${fav.city}</div>
                        </div>
                    `).join('');
                });
        }

        function searchFavorite(city) {
            document.getElementById('cityInput').value = city;
            searchWeather();
        }

        function deleteFavorite(id) {
            fetch(`${API_URL}/favorites/${id}`, {
                method: 'DELETE'
            })
            .then(() => loadFavorites());
        }
    </script>
</body>
</html>
